openapi: 3.1.0
info:
  title: Crudex school API
  version: 1.0.0
  description: Application Worker contract. Sessions are scoped to one active membership. Use the application Worker origin for API requests.
servers:
  - url: /api
security:
  - schoolSession: []
  - localSession: []
paths:
  /admin/directory:
    get:
      operationId: getAdminDirectory
      summary: List school setup options
      description: Requires a platform administrator session.
      tags:
        - administration
      parameters:
        - name: schoolId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/adminDirectorySchema'
        default:
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /admin/setup:
    post:
      operationId: postAdminSetup
      summary: Provision school access
      description: Requires a platform administrator session.
      tags:
        - administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/adminCommandSchema'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/adminResultSchema'
        default:
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /health:
    get:
      summary: Check application Worker health
      operationId: getHealth
      tags:
        - health
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthResponse'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      security: []
  /notes:
    get:
      summary: List template notes
      operationId: getNotes
      tags:
        - notes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/noteList'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      security: []
    post:
      summary: Create a template note
      operationId: postNotes
      tags:
        - notes
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/note'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createNote'
  /notes/{id}:
    delete:
      summary: Delete a template note
      operationId: deleteNotesId
      tags:
        - notes
      responses:
        '204':
          description: Success
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      security: []
  /auth/session:
    post:
      summary: Exchange a single-use invitation for a session
      operationId: postAuthSession
      tags:
        - auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/credential'
    delete:
      summary: Sign out and expire the cookie
      operationId: deleteAuthSession
      tags:
        - auth
      responses:
        '204':
          description: Success
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      security: []
  /auth/guest:
    post:
      summary: Start a guest session with a private sample school and class
      operationId: postAuthGuest
      tags:
        - auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/guestSignIn'
  /auth/local:
    post:
      summary: Start a loopback development session
      operationId: postAuthLocal
      tags:
        - auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/localSignIn'
  /auth/membership:
    post:
      summary: Select another active membership of this account
      operationId: postAuthMembership
      tags:
        - auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/selectMembership'
  /me:
    get:
      summary: Read active actor and available memberships
      operationId: getMe
      tags:
        - me
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/me'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /integrations/kahoot/connect:
    get:
      summary: Start connecting a teacher's Kahoot account
      operationId: getKahootConnect
      description: Use a top-level navigation on the application origin with a teacher session.
      tags:
        - integrations
      responses:
        '303':
          description: Continue to Kahoot sign-in.
          headers:
            Location:
              schema:
                type: string
                format: uri
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /integrations/kahoot/callback:
    get:
      summary: Complete Kahoot authorization
      operationId: getKahootCallback
      description: Kahoot sends the browser here. The single-use state identifies the authorization attempt.
      tags:
        - integrations
      security: []
      parameters:
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        '303':
          description: Return to the school app with the connection result.
          headers:
            Location:
              schema:
                type: string
                enum: ['/?kahoot=connected', '/?kahoot=failed']
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
  /integrations/kahoot/status:
    get:
      summary: Read the signed-in teacher's Kahoot connection status
      operationId: getKahootStatus
      tags:
        - integrations
      responses:
        '200':
          description: Connection status for this teacher and school.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kahootStatus'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /integrations/kahoot/disconnect:
    post:
      summary: Disconnect the signed-in teacher's Kahoot account
      operationId: postKahootDisconnect
      description: Send from the application origin with a teacher session.
      tags:
        - integrations
      responses:
        '200':
          description: Connection status after disconnecting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kahootStatus'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /agents:
    get:
      summary: List agents available to this membership
      operationId: getAgents
      tags:
        - agents
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/agent'
                required:
                  - agents
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /agents/{id}/runs:
    post:
      summary: Accept an idempotent teacher or principal run
      operationId: postAgentsIdRuns
      tags:
        - agents
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/run'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/agentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createRun'
  /agents/{id}/history:
    get:
      summary: Read up to 100 recent visible runs
      operationId: getAgentsIdHistory
      tags:
        - agents
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/historicRun'
                required:
                  - runs
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/agentId'
  /runs/{id}/events:
    get:
      summary: Replay committed events after the cursor
      operationId: getRunsIdEvents
      tags:
        - runs
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                type: string
                description:
                  SSE frames with a numeric id and JSON runEvent as data. Reconnect at EOF; close on
                  terminal event.
        '204':
          description: Terminal event already consumed. Stop reconnecting.
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Last-Event-ID
          schema:
            type: integer
            minimum: 0
  /runs/{id}/cancel:
    post:
      summary: Cancel the owned run and revoke its callback credential
      operationId: postRunsIdCancel
      tags:
        - runs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/run'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
  /runs/{id}/memory:
    get:
      summary: List memory proposals for this run
      operationId: getRunsIdMemory
      tags:
        - runs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/memoryProposal'
                required:
                  - proposals
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
  /runs/{id}/memory/{proposalId}/approve:
    post:
      summary: Approve one proposed memory
      operationId: postRunsIdMemoryProposalIdApprove
      tags:
        - runs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved:
                    const: true
                required:
                  - approved
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
            format: uuid
  /memories:
    get:
      summary: List up to 100 approved memories for this owner
      operationId: getMemories
      tags:
        - memories
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/memoryItem'
                required:
                  - items
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /memories/{id}:
    delete:
      summary: Forget an approved memory
      operationId: deleteMemoriesId
      tags:
        - memories
      responses:
        '204':
          description: Success
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
  /classes/{id}/gradebook:
    get:
      summary: Read combined scores and published worksheets for an assigned class
      operationId: getClassesIdGradebook
      tags:
        - classes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gradebook'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
  /assessments/{id}:
    get:
      summary: Read a teacher worksheet and answer key
      operationId: getAssessmentsId
      tags:
        - assessments
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/worksheet'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
  /play/{id}:
    get:
      summary: Read student-safe quiz content by play token
      operationId: getPlayId
      tags:
        - play
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quiz'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
    post:
      summary: Record one submission per student and assessment
      operationId: postPlayId
      tags:
        - play
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/result'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submission'
  /routines:
    get:
      summary: List the teacher’s classroom schedules
      operationId: getRoutines
      tags:
        - routines
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  routines:
                    type: array
                    items:
                      $ref: '#/components/schemas/routineRecord'
                required:
                  - routines
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
    post:
      summary: Schedule a daily parent report in Bangkok time
      operationId: postRoutines
      tags:
        - routines
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/routineRecord'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/routine'
  /routines/{id}:
    patch:
      summary: Enable or pause an owned routine
      operationId: patchRoutinesId
      tags:
        - routines
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/routineRecord'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/routineUpdate'
  /reports:
    get:
      summary: Read teacher drafts or delivered guardian reports
      operationId: getReports
      tags:
        - reports
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/report'
                required:
                  - reports
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /briefs/morning:
    get:
      summary: Read principal-only aggregate data for a Bangkok calendar day
      operationId: getBriefsMorning
      tags:
        - briefs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/brief'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
  /approvals:
    post:
      summary: Submit a budget claim
      operationId: postApprovals
      tags:
        - approvals
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/budgetClaim'
    get:
      summary: List visible claims
      operationId: getApprovals
      tags:
        - approvals
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims:
                    type: array
                    items:
                      $ref: '#/components/schemas/claim'
                required:
                  - claims
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
  /approvals/{id}:
    get:
      summary: Read a visible claim
      operationId: getApprovalsId
      tags:
        - approvals
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
  /approvals/{id}/decision:
    post:
      summary: Record a principal’s explicit decision
      operationId: postApprovalsIdDecision
      tags:
        - approvals
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/claimDecision'
  /approval-notifications:
    get:
      summary: Read the teacher’s decision notifications
      operationId: getApprovalNotifications
      tags:
        - approval-notifications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/notification'
                required:
                  - notifications
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: query
          name: channel
          schema:
            type: string
            enum:
              - teacher
              - budget_assistant
  /internal/runs/{id}/tools/save_assessment:
    post:
      summary: Private run tool save_assessment
      operationId: postInternalRunsIdToolsSaveAssessment
      tags:
        - internal
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  worksheetUrl:
                    type: string
                  formUrl:
                    type: string
                required:
                  - id
                  - worksheetUrl
                  - formUrl
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      security:
        - runCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/saveWorksheet'
  /internal/runs/{id}/tools/get_scores:
    post:
      summary: Private run tool get_scores
      operationId: postInternalRunsIdToolsGetScores
      tags:
        - internal
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gradebook'
        default:
          description: Request failed. See status and error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
      parameters:
        - in: path
          name: id
          required: true
          schema:
