name = "crudex-agent"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
DAILY_RUN_LIMIT = "60"
DAILY_RUN_LIMIT_OVERRIDES = { "2026-11-21" = 300 }
IDLE_STOP_MINUTES = "10"
# Rollback switch: "vercel" sends every school turn to the Vercel sandbox as before.
# "openai" answers chat/memory turns and the agents in OPENAI_AGENTS from OpenAI in this Worker.
AGENT_BACKEND = "vercel"
OPENAI_AGENTS = "nun"

# Agent skills (SKILL.md) are imported as text by the OpenAI backend.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[secrets]
required = ["PASSCODE", "OPENAI_API_KEY", "VERCEL_TOKEN", "VERCEL_TEAM_ID", "VERCEL_PROJECT_ID"]

[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "SandboxManager"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SandboxManager"]

[[durable_objects.bindings]]
name = "BRIEFS"
class_name = "MorningBrief"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MorningBrief"]

[[durable_objects.bindings]]
name = "KAHOOT"
class_name = "KahootConnection"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["KahootConnection"]
